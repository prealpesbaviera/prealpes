
name: Publicar historias del blog

on:
  push:
    branches:
      - main
    paths:
      - "blog/historias/**"
      - "scripts/generar_blog.py"
      - ".github/workflows/publicar-blog.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install markdown pyyaml

      - name: Generar paginas del blog
        run: python scripts/generar_blog.py

      - name: Guardar paginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historias publicadas"
            git push
          fi
