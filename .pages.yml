
media:
  input: blog/imagenes
  output: /blog/imagenes

content:
  - name: historias
    label: Historias de montaña
    type: collection
    path: blog/historias
    filename: "{primary}.md"
    view:
      fields: [title, numero, fecha]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: numero
        label: Número de cumbre
        type: number
        required: true
      - name: fecha
        label: Fecha de ascenso
        type: date
      - name: imagen
        label: Fotografía principal
        type: image
      - name: body
        label: Mi historia
        type: rich-text
      - name: galeria
        label: Galería de fotografías
        type: image
        list: true
        
- name: altitud
  label: Altitud de la montaña
  type: string

- name: desnivel
  label: Desnivel positivo
  type: string

- name: distancia
  label: Distancia recorrida
  type: string

- name: duracion
  label: Duración de la caminata
  type: string

- name: dificultad
  label: Dificultad
  type: select
  options:
    values:
      - value: Facil
        label: Fácil
      - value: Moderada
        label: Moderada
      - value: Exigente
        label: Exigente

- name: acceso
  label: Acceso y transporte público
  type: string

      - name: estado
        label: Estado de publicación
        type: select
        default: borrador
        options:
          values:
            - value: borrador
              label: Borrador
            - value: publicado
              label: Publicado
